# Festergut, 25-player normal. Positions are room coordinates in yards; Festergut stands at (4267.92, 3137.26).
# Every raid member is a stand-in (spec §6.3): tanks and melee are rate stand-ins, healers and ranged are generic
# ability-using actors (A-035). The three Gate 1 specs replace t1, one healer and one ranged in Plan 3.
id: festergut-25n
boss: festergut
roster:
  - { id: t1, name: Tormund, kind: standin, role: tank, maxHealth: 95000, ratePerSecond: 3000, armor: 50000, avoidance: { missPct: 8, dodgePct: 27, parryPct: 22 }, threatMultiplier: 8, reason: "armor at the cap and 57 % avoidance stand in for tank cooldowns and block at three Inhaled Blight stacks (A-039)", reaction: { minMs: 300, maxMs: 600 } }
